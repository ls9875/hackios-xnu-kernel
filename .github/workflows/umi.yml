name: umi

# Build what the Mi 10 (umi, SM8250) port needs, on a Linux host, without a Linux host.
#
#   loader  always   -- proves xnuloader's platform_umi compiles; artifact loader.efi
#   kernel  always   -- XNU with the port on top, for `xl run` to upload; artifact umi-kernel
#   uefi    optional -- Mu-Silicium with Platforms/Xiaomi/umiPkg; artifact SILICIUM_UEFI.fd
#   images  optional -- iOS 16.5 out of Apple's IPSW and the APFS images; artifact images
#
# The iOS IPSW is 7.4 GB and the images are ~2.5 GB, so `images` is the slow one. The kernel
# job is the other slow one: theos and its Linux toolchain are about 2 GB, and XNU itself
# takes a while. Neither is needed for `fastboot boot` -- the kernel is uploaded over USB by
# `xl run` (xnuloader/mkpayload.py), not carried in the boot image -- so this job exists for
# kernel-side work: drivers, boot-args, anything under xnu/.

on:
  workflow_dispatch:
    inputs:
      uefi:
        description: "Build the Mu-Silicium UEFI for umi (umiPkg from aliothPkg)"
        type: boolean
        default: true
      images:
        description: "Fetch iOS 16.5 and build the APFS images (7.4 GB download)"
        type: boolean
        default: false

# Concurrency, per kind of run. Grouping on the ref alone serialised everything: an images run
# (up to 5 h) would sit in front of a UEFI run, and the two share nothing but a checkout.
# Two runs of the same kind still queue behind each other, which is what the group is for.
concurrency:
  group: umi-${{ github.ref }}-uefi-${{ github.event.inputs.uefi }}-images-${{ github.event.inputs.images }}
  cancel-in-progress: false

jobs:
  loader:
    name: loader (platform_umi)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld
          clang --version | head -1
          lld-link --version

      - name: Build
        run: |
          bash xnuloader/build.sh
          file xnuloader/loader.efi
          ls -la xnuloader/loader.efi

      - name: Confirm platform_umi is in the binary
        run: |
          # strings only prints runs of 4 or more characters by default and "umi" is three, so -n 3.
          # Both names have to be there: the loader picks a platform by the framebuffer the UEFI
          # reports, and a port that silently lost its entry would still build and boot as ramfb.
          strings -a -n 3 xnuloader/loader.efi | grep -qx umi \
            || { echo "::error::platform_umi missing from loader.efi"; exit 1; }
          strings -a -n 3 xnuloader/loader.efi | grep -qx redwood \
            || { echo "::error::platform_redwood missing from loader.efi"; exit 1; }
          echo "platform_umi and platform_redwood are both in the binary"

      - uses: actions/upload-artifact@v4
        with:
          name: umi-loader
          path: xnuloader/loader.efi
          if-no-files-found: error

  kernel:
    name: kernel (XNU for umi)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Its own group: a kernel run and a UEFI run share nothing but a checkout, and a kernel run
    # must not queue behind an images run that takes hours.
    concurrency:
      group: umi-${{ github.ref }}-kernel
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm flex bison m4 perl python3 autoconf automake \
            libtool curl xz-utils git build-essential libxml2 libtinfo6
          clang --version | head -1

      # theos: the cctools Mach-O linker the kernel is linked with. Its Linux toolchain is a
      # prebuilt clang for arm64-apple-ios, unpacked over toolchain/linux/iphone.
      - name: theos and its Linux toolchain
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          git clone --depth 1 https://github.com/theos/theos.git "$THEOS"
          curl -fsSL --retry 3 \
            https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz \
            | tar -xJf - -C "$THEOS/toolchain/"
          test -x "$THEOS/toolchain/linux/iphone/bin/clang"
          test -x "$THEOS/toolchain/linux/iphone/bin/ld"

      # xnu/README.md was written against clang 22; the distribution's is 18, which is the closer
      # match to a 2023 kernel anyway (xnu-clang drops the flags only Apple's clang knows).
      # apt.llvm.org is not used: for noble it carries only clang-24, which is too new for this
      # XNU. Say which one is in play, so a failure names the compiler.
      - name: Clang
        run: |
          clang --version | head -1
          clang -dumpversion

      # iPhoneOS16.5.sdk is what the kernel is compiled against; it is in the current release
      # of github.com/theos/sdks. Read the tag through the API rather than hard-coding it.
      - name: iPhoneOS16.5.sdk
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          mkdir -p "$THEOS/sdks"
          tag=$(curl -fsSL https://api.github.com/repos/theos/sdks/releases/latest \
            | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p')
          [ -n "$tag" ] || { echo "::error::cannot read the theos/sdks release tag"; exit 1; }
          echo "iPhoneOS16.5.sdk from theos/sdks@$tag"
          curl -fsSL --retry 3 \
            "https://github.com/theos/sdks/releases/download/$tag/iPhoneOS16.5.sdk.tar.xz" \
            | tar -xJf - -C "$THEOS/sdks"
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk/usr/include"

      - name: XNU sources with the port on top (xnu/apply.sh)
        run: bash xnu/apply.sh

      # stage 1: Apple's open sources the kernel links, mig/unifdef/tcsh, and the SDK as links
      - name: Dependencies (xnu-deps/setup.sh --stage1)
        env:
          THEOS: ${{ github.workspace }}/theos
        run: bash xnu-deps/setup.sh --stage1

      # stage 2 needs the kernel's exported headers, so the export comes first and the script
      # again -- common/build.sh does the same two steps in this order.
      - name: Export the kernel's headers
        run: ./xnu-build.sh -j"$(nproc)" exporthdrs

      - name: Dependencies (xnu-deps/setup.sh --stage2)
        env:
          THEOS: ${{ github.workspace }}/theos
        run: bash xnu-deps/setup.sh --stage2

      - name: Build
        run: |
          # pipefail: a failed build must not look green because tee was the last command
          set -o pipefail
          ./xnu-build.sh -j"$(nproc)" -k 2>&1 | tee kernel-build.log
          K=xnu-src/xnu-8796.121.2/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837
          [ -s "$K" ] || { echo "::error::no kernel was built"; tail -80 kernel-build.log; exit 1; }
          echo "kernel $(stat -c %s $K) bytes"
          # the port's drivers have to be in it: a build that silently dropped one would still
          # boot, just without the touch screen
          nm "$K" 2>/dev/null | grep -q -w umi_touch_init \
            || { echo "::error::umi_touch_init is not in the kernel"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: umi-kernel
          path: xnu-src/xnu-8796.121.2/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837
          if-no-files-found: error

  uefi:
    name: UEFI (Mu-Silicium umiPkg)
    if: ${{ inputs.uefi }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm nasm python3 python3-pip python3-venv \
            gcc-aarch64-linux-gnu build-essential uuid-dev iasl git
          clang --version | head -1
          nasm -v

      - name: Mu-Silicium + the redwood port (uefi/apply.sh)
        run: |
          bash uefi/apply.sh
          # the shim's build needs make + an aarch64 gcc; the port's patch expects both to exist
          echo "Mu-Silicium at $(git -C Mu-Silicium rev-parse --short HEAD)"

      - name: Turn alioth into umi (uefi/umi-port.sh)
        run: bash uefi/umi-port.sh

      - name: mu_nasm without Mono (uefi/README.md)
        run: |
          D=Mu-Silicium/Mu_Basecore/BaseTools/Bin/mu_nasm_extdep
          mkdir -p "$D/Linux-x86-64"
          echo 'version: 20016.1.1' > "$D/extdep_state.yaml"
          ln -sf /usr/bin/nasm /usr/bin/ndisasm "$D/Linux-x86-64/"
          ls -la "$D/Linux-x86-64/"

      - name: Build
        working-directory: Mu-Silicium
        run: |
          # pipefail: `| tee` on its own reports tee's exit code, so a failed build_uefi.py still looked
          # green and the only artefact was a 68-byte log. The FD check below is the second belt.
          set -o pipefail
          python3 -m venv ../venv
          ../venv/bin/pip install -q --upgrade pip
          ../venv/bin/pip install -q -r pip-requirements.txt
          ../venv/bin/python3 build_uefi.py -d umi -r RELEASE 2>&1 | tee ../uefi-build.log
          echo "--- tail ---"
          tail -40 ../uefi-build.log
          FD=Build/umiPkg/RELEASE_CLANGPDB/FV/SILICIUM_UEFI.fd
          if [ ! -s "$FD" ]; then
            echo "::error::build_uefi.py returned 0 but $FD is missing or empty"
            ls -la Build/umiPkg 2>/dev/null || echo "no Build/umiPkg at all"
            exit 1
          fi
          echo "SILICIUM_UEFI.fd $(stat -c %s $FD) bytes"
          # 0x9FC00000 is where the shim will put this: FV base must agree with umi.toml
          od -An -tx4 -N4 "$FD"

      # The FD is not what you flash. `fastboot boot` needs an Android boot image holding
      # BootShim + FD + the XNU loader payload, and that is what these two steps make:
      # mkxnuimg.py (called by common/build.sh) rebuilds BootShim with PAYLOAD_BASE baked in.
      - name: Loader (xnuloader/build.sh)
        run: |
          bash xnuloader/build.sh
          file xnuloader/loader.efi
          ls -la xnuloader/loader.efi

      - name: Boot image for fastboot (common/build.sh umi)
        run: |
          set -o pipefail
          SKIP="kernel images" bash common/build.sh umi 2>&1 | tee bootimg.log
          tail -20 bootimg.log
          [ -s out/umi-boot.img ] || { echo "::error::common/build.sh did not produce out/umi-boot.img"; ls -la out/ || true; exit 1; }
          ls -la out/umi-boot.img

      - name: Collect
        if: always()
        run: |
          # dist/, not out/: common/build.sh uses out/ for its own products
          mkdir -p dist
          cp Mu-Silicium/Build/umiPkg/RELEASE_CLANGPDB/FV/SILICIUM_UEFI.fd dist/ 2>/dev/null || true
          cp Mu-Silicium/BootShim/BootShim.bin dist/ 2>/dev/null || true
          cp out/umi-boot.img dist/ 2>/dev/null || true
          cp uefi-build.log bootimg.log dist/ 2>/dev/null || true
          ls -la dist/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: umi-uefi
          path: dist/
          if-no-files-found: warn

  images:
    name: iOS 16.5 images
    if: ${{ inputs.images }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Toolchain
        run: |
          sudo apt-get update -qq
          # 7-Zip 23 or newer: it is what reads APFS
          sudo apt-get install -y -qq 7zip clang lld gcc build-essential python3 python3-venv \
            liblz4-dev git curl
          7z 2>&1 | head -2

      - name: Workspace (common/setup.sh)
        # common/setup.sh clones hackios-xnu-userland into this tree. Pointed at a fork for one
        # reason: userland/build.sh copies obj/drawable_test unconditionally, and prebuilt/userland
        # (what a runner without ld64 falls back to) predates that program, so the build died at
        # `cp: cannot stat 'obj/drawable_test'` and produced no images. The fork carries a one-line
        # fix -- the same `[ -f ... ] &&` guard every other program on that line already had. Drop
        # USERLAND_URL once that is upstream.
        env:
          USERLAND_URL: https://github.com/ls9875/hackios-xnu-userland.git
        run: bash common/setup.sh

      - name: iOS 16.5 out of Apple's IPSW (7.4 GB)
        run: bash ios165/fetch.sh

      - name: Images
        run: |
          # pipefail for the same reason as the UEFI build: this reported success once already while
          # userland/build.sh had died on its first cp.
          set -o pipefail
          SKIP="kernel boot" bash common/build.sh umi 2>&1 | tee images-build.log
          tail -30 images-build.log
          for f in userland/root.apfs userland/system.apfs; do
            [ -s "$f" ] || { echo "::error::$f was not produced"; ls -la userland/ || true; exit 1; }
          done
          ls -la userland/*.apfs

      - name: Collect
        if: always()
        run: |
          mkdir -p dist
          cp userland/root.apfs userland/system.apfs dist/ 2>/dev/null || true
          cp images-build.log dist/ 2>/dev/null || true
          ls -la dist/ || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: umi-images
          path: dist/
          if-no-files-found: warn
