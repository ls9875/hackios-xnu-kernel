name: umi

# Build what the Mi 10 (umi, SM8250) port needs, on a Linux host, without a Linux host.
#
#   loader  always   -- proves xnuloader's platform_umi compiles; artifact loader.efi
#   uefi    optional -- Mu-Silicium with Platforms/Xiaomi/umiPkg; artifact SILICIUM_UEFI.fd
#   images  optional -- iOS 16.5 out of Apple's IPSW and the APFS images; artifact images
#
# The iOS IPSW is 7.4 GB and the images are ~2.5 GB, so `images` is the slow one.

on:
  workflow_dispatch:
    inputs:
      uefi:
        description: "Build the Mu-Silicium UEFI for umi (umiPkg from kebabPkg)"
        type: boolean
        default: true
      images:
        description: "Fetch iOS 16.5 and build the APFS images (7.4 GB download)"
        type: boolean
        default: false

concurrency:
  # One group per ref *and* per kind of run. Grouping on the ref alone serialised everything: an
  # images run (up to 5 h) would sit in front of a UEFI run, and the two share nothing but a checkout.
  # Two UEFI runs still queue behind each other, which is what the group is for.
  group: umi-${{ github.ref }}-uefi-${{ github.event.inputs.uefi }}-images-${{ github.event.inputs.images }}
  cancel-in-progress: false

jobs:
  loader:
    name: loader (platform_umi)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld
          clang --version | head -1
          lld-link --version

      - name: Build
        run: |
          bash xnuloader/build.sh
          file xnuloader/loader.efi
          ls -la xnuloader/loader.efi

      - name: Confirm platform_umi is in the binary
        run: |
          # strings only prints runs of 4 or more characters by default and "umi" is three, so -n 3.
          # Both names have to be there: the loader picks a platform by the framebuffer the UEFI
          # reports, and a port that silently lost its entry would still build and boot as ramfb.
          strings -a -n 3 xnuloader/loader.efi | grep -qx umi \
            || { echo "::error::platform_umi missing from loader.efi"; exit 1; }
          strings -a -n 3 xnuloader/loader.efi | grep -qx redwood \
            || { echo "::error::platform_redwood missing from loader.efi"; exit 1; }
          echo "platform_umi and platform_redwood are both in the binary"

      - uses: actions/upload-artifact@v4
        with:
          name: umi-loader
          path: xnuloader/loader.efi
          if-no-files-found: error

  uefi:
    name: UEFI (Mu-Silicium umiPkg)
    if: ${{ inputs.uefi }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm nasm python3 python3-pip python3-venv \
            gcc-aarch64-linux-gnu build-essential uuid-dev iasl git
          clang --version | head -1
          nasm -v

      - name: Mu-Silicium + the redwood port (uefi/apply.sh)
        run: |
          bash uefi/apply.sh
          # the shim's build needs make + an aarch64 gcc; the port's patch expects both to exist
          echo "Mu-Silicium at $(git -C Mu-Silicium rev-parse --short HEAD)"

      - name: Turn kebab into umi (uefi/umi-port.sh)
        run: bash uefi/umi-port.sh

      - name: mu_nasm without Mono (uefi/README.md)
        run: |
          D=Mu-Silicium/Mu_Basecore/BaseTools/Bin/mu_nasm_extdep
          mkdir -p "$D/Linux-x86-64"
          echo 'version: 20016.1.1' > "$D/extdep_state.yaml"
          ln -sf /usr/bin/nasm /usr/bin/ndisasm "$D/Linux-x86-64/"
          ls -la "$D/Linux-x86-64/"

      - name: Build
        working-directory: Mu-Silicium
        run: |
          # pipefail: `| tee` on its own reports tee's exit code, so a failed build_uefi.py still looked
          # green and the only artefact was a 68-byte log. The FD check below is the second belt.
          set -o pipefail
          python3 -m venv ../venv
          ../venv/bin/pip install -q --upgrade pip
          ../venv/bin/pip install -q -r pip-requirements.txt
          ../venv/bin/python3 build_uefi.py -d umi -r RELEASE 2>&1 | tee ../uefi-build.log
          echo "--- tail ---"
          tail -40 ../uefi-build.log
          FD=Build/umiPkg/RELEASE_CLANGPDB/FV/SILICIUM_UEFI.fd
          if [ ! -s "$FD" ]; then
            echo "::error::build_uefi.py returned 0 but $FD is missing or empty"
            ls -la Build/umiPkg 2>/dev/null || echo "no Build/umiPkg at all"
            exit 1
          fi
          echo "SILICIUM_UEFI.fd $(stat -c %s $FD) bytes"
          # 0x9FC00000 is where the shim will put this: FV base must agree with umi.toml
          od -An -tx4 -N4 "$FD"

      # The FD is not what you flash. `fastboot boot` needs an Android boot image holding
      # BootShim + FD + the XNU loader payload, and that is what these two steps make:
      # mkxnuimg.py (called by common/build.sh) rebuilds BootShim with PAYLOAD_BASE baked in.
      - name: Loader (xnuloader/build.sh)
        run: |
          bash xnuloader/build.sh
          file xnuloader/loader.efi
          ls -la xnuloader/loader.efi

      - name: Boot image for fastboot (common/build.sh umi)
        run: |
          set -o pipefail
          SKIP="kernel images" bash common/build.sh umi 2>&1 | tee bootimg.log
          tail -20 bootimg.log
          [ -s out/umi-boot.img ] || { echo "::error::common/build.sh did not produce out/umi-boot.img"; ls -la out/ || true; exit 1; }
          ls -la out/umi-boot.img

      - name: Collect
        if: always()
        run: |
          # dist/, not out/: common/build.sh uses out/ for its own products
          mkdir -p dist
          cp Mu-Silicium/Build/umiPkg/RELEASE_CLANGPDB/FV/SILICIUM_UEFI.fd dist/ 2>/dev/null || true
          cp Mu-Silicium/BootShim/BootShim.bin dist/ 2>/dev/null || true
          cp out/umi-boot.img dist/ 2>/dev/null || true
          cp uefi-build.log bootimg.log dist/ 2>/dev/null || true
          ls -la dist/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: umi-uefi
          path: dist/
          if-no-files-found: warn

  images:
    name: iOS 16.5 images
    if: ${{ inputs.images }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Toolchain
        run: |
          sudo apt-get update -qq
          # 7-Zip 23 or newer: it is what reads APFS
          sudo apt-get install -y -qq 7zip clang lld gcc build-essential python3 python3-venv \
            liblz4-dev git curl
          7z 2>&1 | head -2

      - name: Workspace (common/setup.sh)
        # common/setup.sh clones hackios-xnu-userland into this tree. Pointed at a fork for one
        # reason: userland/build.sh copies obj/drawable_test unconditionally, and prebuilt/userland
        # (what a runner without ld64 falls back to) predates that program, so the build died at
        # `cp: cannot stat 'obj/drawable_test'` and produced no images. The fork carries a one-line
        # fix -- the same `[ -f ... ] &&` guard every other program on that line already had. Drop
        # USERLAND_URL once that is upstream.
        env:
          USERLAND_URL: https://github.com/ls9875/hackios-xnu-userland.git
        run: bash common/setup.sh

      - name: iOS 16.5 out of Apple's IPSW (7.4 GB)
        run: bash ios165/fetch.sh

      - name: Images
        run: |
          # pipefail for the same reason as the UEFI build: this reported success once already while
          # userland/build.sh had died on its first cp.
          set -o pipefail
          SKIP="kernel boot" bash common/build.sh umi 2>&1 | tee images-build.log
          tail -30 images-build.log
          for f in userland/root.apfs userland/system.apfs; do
            [ -s "$f" ] || { echo "::error::$f was not produced"; ls -la userland/ || true; exit 1; }
          done
          ls -la userland/*.apfs

      - name: Collect
        if: always()
        run: |
          mkdir -p dist
          cp userland/root.apfs userland/system.apfs dist/ 2>/dev/null || true
          cp images-build.log dist/ 2>/dev/null || true
          ls -la dist/ || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: umi-images
          path: dist/
          if-no-files-found: warn
