# Xiaomi Mi 10 (umi) -- Snapdragon 865 / SM8250 "kona".
# Written by hand from the phone's own device tree (see PORT-UMI.md), because common/new-device.sh
# needs dtc, which this host does not have.
#
# Provenance of every value is in PORT-UMI.md ("Verified from the phone").
NAME="Xiaomi Mi 10 (umi)"
KIND=phone
SOC="Qualcomm Snapdragon 865 (SM8250)"

# --- boot chain (phones) ---------------------------------------------------------------------------
# The phone boots a Mu-Silicium UEFI (Project Silicium) with `fastboot boot`; the UEFI starts our loader.
# umi is NOT upstream in Mu-Silicium. The package to start from is Xiaomi/aliothPkg (POCO F3, SM8250-AC
# = Snapdragon 870): same silicon, same vendor, so its Binaries/ are Xiaomi's own UEFI drivers rather
# than another vendor's. See PORT-UMI.md step 1.
UEFI_TARGET=umi
UEFI_FD=                        # empty: Mu-Silicium/Build/umiPkg/... or prebuilt/uefi/umi
DTB=                            # empty: uefi/files/Resources/DTBs/umi.dtb (uefi/apply.sh puts it in Mu-Silicium)
# All three from uefi/files/Platforms/Xiaomi/umiPkg/Library/MemoryMapLib/MemoryMapLib.c, which is
# alioth's table with the XNU payload region added. alioth's map matches umi's own /reserved-memory
# region for region -- HYP, AOP CMD DB, SMEM, QTEE+TZApps, PIL, Display Reserved -- so the addresses
# below are the same ones a Xiaomi SM8250 device already boots with.
FD_BASE=0x9FC00000              # "UEFI FD" in the map; umi.toml [uefi_fd] must match
FD_SIZE=0x300000
PAYLOAD_BASE=0xF0000000         # "XNU Payload" in the map; also hardcoded in xnuloader/loader.c

# --- kernel and loader -----------------------------------------------------------------------------
# xnuloader/loader.c picks its `struct platform` by the framebuffer base the UEFI reports, which is the
# base of the map's "Display Reserved" region -- the same relationship redwood has (0xE1000000).
FB_BASE=0x9C000000              # if the phone shows nothing, the loader's "display 1080 x 2340 at ..." line has the real value
WIFI_ATH11K=0                   # Mi 10 pairs a WCN3990-class radio, not the WCN6750 ath11k path

# --- what the run needs ----------------------------------------------------------------------------
# No touch driver for umi yet (the kernel's is Goodix GT9916 over bit-banged SPI; umi is ST Focaltech
# over GENI I2C SE13), so start without it: framebuffer + CPU is enough for the lock screen.
BOOTARGS="cpus=8"
DEFAULT_SECS=900
USERLAND_VARS=""                # extra variables for userland/build.sh, e.g. "GL=1"
FIRMWARE=""                     # no GPU/Wi-Fi/audio firmware for a first boot
