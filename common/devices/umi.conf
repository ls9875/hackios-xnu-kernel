# Xiaomi Mi 10 (umi) -- Snapdragon 865 / SM8250 "kona".
# Written by hand from the phone's own device tree (see PORT-UMI.md), because common/new-device.sh
# needs dtc, which this host does not have.
#
# Provenance of every value is in PORT-UMI.md ("Verified from the phone").
NAME="Xiaomi Mi 10 (umi)"
KIND=phone
SOC="Qualcomm Snapdragon 865 (SM8250)"

# --- boot chain (phones) ---------------------------------------------------------------------------
# The phone boots a Mu-Silicium UEFI (Project Silicium) with `fastboot boot`; the UEFI starts our loader.
# umi is NOT upstream in Mu-Silicium. The SM8250 package to start from is OnePlus/kebabPkg (OnePlus 8T,
# same SoC). See PORT-UMI.md step 1.
UEFI_TARGET=umi
UEFI_FD=                        # empty: Mu-Silicium/Build/umiPkg/... or prebuilt/uefi
DTB=                            # empty: uefi/files/Resources/DTBs/umi.dtb (uefi/apply.sh puts it in Mu-Silicium)
FD_BASE=0x9FD00000              # TODO(umi): from the umiPkg memory map; redwood's value is a placeholder
FD_SIZE=0x200000                # TODO(umi)
PAYLOAD_BASE=0xF0000000         # TODO(umi): free RAM for the kernel + images container

# --- kernel and loader -----------------------------------------------------------------------------
# xnuloader/loader.c picks its `struct platform` by the framebuffer base the UEFI reports.
FB_BASE=0x00000000              # TODO(umi): run the loader once and read "display W x H at ..." in the log
WIFI_ATH11K=0                   # Mi 10 pairs a WCN3990-class radio, not the WCN6750 ath11k path

# --- what the run needs ----------------------------------------------------------------------------
# No touch driver for umi yet (the kernel's is Goodix GT9916 over bit-banged SPI; umi is ST Focaltech
# over GENI I2C SE13), so start without it: framebuffer + CPU is enough for the lock screen.
BOOTARGS="cpus=8"
DEFAULT_SECS=900
USERLAND_VARS=""                # extra variables for userland/build.sh, e.g. "GL=1"
FIRMWARE=""                     # no GPU/Wi-Fi/audio firmware for a first boot
